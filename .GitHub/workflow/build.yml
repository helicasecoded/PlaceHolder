name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Extract app.zip
        id: site
        run: |
          mkdir site
          unzip -o app.zip -d site
          ROOT=$(dirname "$(find site -name index.html | head -1)")
          echo "root=$ROOT" >> "$GITHUB_OUTPUT"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.site.outputs.root }}
      - id: deployment
        uses: actions/deploy-pages@v4
